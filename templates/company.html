{% extends "base.html" %}
{% block title %}Company details{% endblock %}
{% block content %}
<h1>Company details</h1>
<p class="muted">Printed on every Journey Management Plan.</p>
<form class="form" method="post" action="/company">
  <div class="row"><label>Company name</label><input type="text" name="name" value="{{ c.name or '' }}"></div>
  <div class="row"><label>Address</label><input type="text" name="address" value="{{ c.address or '' }}"></div>
  <div class="row"><label>Dispatch phone (24 hr)</label><input type="text" name="dispatch_phone" value="{{ c.dispatch_phone or '' }}"></div>
  <div class="row"><label>Emergency phone (24 hr)</label><input type="text" name="emergency_phone" value="{{ c.emergency_phone or '' }}"></div>
  <div class="row"><label>Safety contact</label><input type="text" name="safety_contact" value="{{ c.safety_contact or '' }}" placeholder="name"></div>
  <div class="row"><label>Safety contact phone</label><input type="text" name="safety_phone" value="{{ c.safety_phone or '' }}"></div>
  <div class="row"><label>Spill response</label><input type="text" name="spill_response" value="{{ c.spill_response or '' }}" placeholder="contractor name / phone, or internal procedure reference"></div>
  <div class="row"><label>Check-in rule</label><textarea name="checkin_rule">{{ c.checkin_rule or '' }}</textarea></div>
  <div class="row"><label>Overdue procedure</label><textarea name="overdue_rule">{{ c.overdue_rule or '' }}</textarea></div>
  <div class="row"><label>Prepared-by signature title</label><input type="text" name="prepared_by_title" value="{{ c.prepared_by_title or '' }}"></div>
  <div class="row"><label>Second signature title</label><input type="text" name="approved_by_title" value="{{ c.approved_by_title or '' }}"></div>
  <div class="row"><label>Show second signature line</label><input type="checkbox" name="require_manager_signature" value="1" {% if c.require_manager_signature %}checked{% endif %}></div>
  <p><button type="submit">Save</button> <a class="btn secondary" href="/jmps">Back to JMPs</a></p>
</form>
{% endblock %}
