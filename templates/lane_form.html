{% extends "base.html" %}
{% block title %}{{ 'Edit lane' if lane else 'New lane' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit lane' if lane else 'New lane' }}</h1>
<form class="form" method="post" action="/lanes/save">
  {% if lane %}<input type="hidden" name="id" value="{{ lane.id }}">{% endif %}
  <div class="row"><label>Account (oil buyer)</label><input type="text" name="account" value="{{ lane.account if lane and lane.account else '' }}"></div>
  <div class="row"><label>Lease operator</label><input type="text" name="operator" value="{{ lane.operator if lane and lane.operator else '' }}"></div>
  <div class="row"><label>Pickup</label><select name="pickup_id" required>{% for p in pickups %}<option value="{{ p.id }}" {% if lane and lane.pickup_id == p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div>
  <div class="row"><label>Drop-off</label><select name="dropoff_id" required>{% for d in drops %}<option value="{{ d.id }}" {% if lane and lane.dropoff_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>
  <div class="hint">If the pickup or drop-off isn't listed, add it on the Locations page first.</div>
  <div class="row"><label>API gravity</label><input type="number" step="any" name="api_gravity" value="{{ lane.api_gravity if lane and lane.api_gravity else '' }}"></div>
  <div class="row"><label>Company rate ($/bbl)</label><input type="number" step="0.01" name="rate" value="{{ lane.rate if lane and lane.rate else '' }}"></div>
  <div class="row"><label>Driver pay ($/bbl)</label><input type="number" step="0.0001" name="driver_pay" value="{{ lane.driver_pay if lane and lane.driver_pay else '' }}"></div>
  <div class="row"><label>Active</label><input type="checkbox" name="active" value="1" {% if not lane or lane.active %}checked{% endif %}></div>
  <div class="row"><label>Notes</label><textarea name="notes">{{ lane.notes if lane and lane.notes else '' }}</textarea></div>
  <p><button type="submit">Save</button> <a class="btn secondary" href="/lanes">Back</a></p>
</form>
{% endblock %}
