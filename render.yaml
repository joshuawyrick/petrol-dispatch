# Render.com blueprint: one web service + one Postgres database. Import the repo in Render and it reads this file.
services:
  - type: web
    name: petrol-dispatch
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: petrol-dispatch-db
          property: connectionString
databases:
  - name: petrol-dispatch-db
    plan: free
